<!doctype html>
<html lang="it">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Glaze Formulation Web</title>
    <meta name="theme-color" content="#141418" />
    <meta name="application-name" content="Glaze Formulation Web" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Glaze Formulation Web" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="manifest" href="manifest.json" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="icon-512.png" />
    <style>
      html, body {
        margin: 0;
        height: 100%;
        background: #141418;
        color: #E8E8EE;
        font-family: "Segoe UI", "Segoe UI Variable", sans-serif;
      }
      iframe {
        border: 0;
        width: 100%;
        height: 100%;
        display: block;
        background: #141418;
      }
      #bar {
        display: none;
        position: fixed;
        left: 0;
        right: 0;
        bottom: 0;
        z-index: 20;
        padding: 12px 16px calc(12px + env(safe-area-inset-bottom));
        background: #1E1E26;
        border-top: 1px solid #3A3A48;
        box-sizing: border-box;
      }
      #bar.show { display: block; }
      #bar p { margin: 0 0 10px; font-size: 14px; line-height: 1.4; }
      #bar button, #bar .ok {
        appearance: none;
        border: 0;
        border-radius: 8px;
        background: #FF7A4E;
        color: #fff;
        font-size: 15px;
        font-weight: 700;
        padding: 10px 14px;
        width: 100%;
      }
      body.has-bar iframe { height: calc(100% - 118px); }
    </style>
  </head>
  <body>
    <iframe
      title="Glaze Formulation Web"
      src="https://glazeformulationweb.streamlit.app/?embed=true"
      allow="fullscreen; clipboard-read; clipboard-write"
    ></iframe>
    <div id="bar">
      <p id="msg"></p>
      <button id="install-btn" type="button" hidden>Installa app</button>
    </div>
    <script>
      if ("serviceWorker" in navigator) {
        navigator.serviceWorker.register("sw.js");
      }
      const bar = document.getElementById("bar");
      const msg = document.getElementById("msg");
      const btn = document.getElementById("install-btn");
      const ua = navigator.userAgent || "";
      const ios = /iPhone|iPad|iPod/i.test(ua);
      const standalone = window.matchMedia("(display-mode: standalone)").matches
        || window.navigator.standalone === true;
      let deferred = null;

      function showBar(text, showButton) {
        msg.textContent = text;
        btn.hidden = !showButton;
        bar.classList.add("show");
        document.body.classList.add("has-bar");
      }

      if (!standalone) {
        if (ios) {
          showBar("iPhone: tocca Condividi (quadrato con freccia) e poi Aggiungi a Home.", false);
        } else if (/Android/i.test(ua)) {
          showBar("Android: quando compare il pulsante, tocca Installa app. Altrimenti apri il menu di Chrome e scegli Installa app.", false);
        }
      }

      window.addEventListener("beforeinstallprompt", function (event) {
        event.preventDefault();
        deferred = event;
        showBar("Tocca Installa app per aggiungerla alla schermata Home, con il logo un1cum.", true);
      });

      btn.addEventListener("click", function () {
        if (!deferred) return;
        deferred.prompt();
        deferred.userChoice.finally(function () {
          deferred = null;
          bar.classList.remove("show");
          document.body.classList.remove("has-bar");
        });
      });
    </script>
  </body>
</html>
